// AudioStream 的 Android 端工程（播放端 + 来源端）。
//
// 依赖仓库刻意与同工作区其它 Android 工程保持一致：本机直连 dl.google.com /
// repo1.maven.org 不通，只有阿里云镜像可用，所以镜像必须排在前面。
pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // PREFER_SETTINGS：模块里再写 repositories 会被这里顶掉，避免同一个依赖
    // 在不同模块里从不同仓库解析出不同版本。
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

rootProject.name = 'audiostream-android'
include ':app'
