// AudioStream 的 Android 端。
//
// 目标一（播放端）：手机连上 PC 的 AudioStream.exe，选它的某个音频设备，把声音拉到本机播放。
// 目标二（来源端）：手机把麦克风与内录做成一台「AudioStream 机器」，让 PC 反过来拉。
//
// 依赖刻意只有两个：junit 与 robolectric（都在本机 Gradle 缓存里）。
// 网络、音频、协议全部用平台 API（java.net / AudioTrack / AudioRecord / ServerSocket），
// 不引 AndroidX 与第三方库——协议部分要逐字节对齐 C# 端，多一层封装只会多一个出错的地方。
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yiyiooo.audiostream'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yiyiooo.audiostream'
        // AudioTrack.Builder 是 API 23 起才有的，而「按格式把 PCM 送到声卡」正是播放端的全部内容。
        // 内录（AudioPlaybackCapture）是 API 29 起，那一块在运行期判断，低版本上只报「不支持」。
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        // 联调测试（androidTest）用 AndroidX 的 runner：平台自带的 android.test.* 在
        // compileSdk 34 上已经被删掉了，没有别的选择。它只进测试产物，不进 APK。
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // 自签名：第一次构建时由 tools/build.ps1 用 keytool 生成，
        // 这样 release 包也能直接 sideload 到手机上。
        local {
            def ks = rootProject.file('tools-cache/audiostream.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword 'audiostream2024'
                keyAlias 'audiostream'
                keyPassword 'audiostream2024'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.local
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    // 源码与单元测试里都有中文
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources.excludes += ['META-INF/*', 'DebugProbesKt.bin']
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                // Robolectric 默认去 Maven Central 下 android-all 包，本机直连不通，指向阿里云镜像。
                systemProperty 'robolectric.dependency.repo.url', 'https://maven.aliyun.com/repository/public'
                systemProperty 'robolectric.dependency.repo.id', 'aliyun'
                systemProperty 'robolectric.logging.enabled', 'false'

                // 联调测试要连的真实 AudioStream 地址由 tools/verify-e2e.ps1 传进来；
                // 不传时测试自己会跳过并说明原因，不会拿假对端顶替。
                systemProperty 'as.host', System.getProperty('as.host', '')
                systemProperty 'as.httpPort', System.getProperty('as.httpPort', '')
                systemProperty 'as.tcpPort', System.getProperty('as.tcpPort', '')
                systemProperty 'as.deviceId', System.getProperty('as.deviceId', '')
                systemProperty 'as.seconds', System.getProperty('as.seconds', '')

                // 联调会打印实际收到的帧数、频率与幅度：断言过了不代表数字好看。
                testLogging {
                    showStandardStreams = true
                }
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // 在 JVM 上跑真实的 Android 类（AudioTrack / AudioRecord 有 shadow 实现），
    // 让「格式映射、播放装配」这些胶水也能自动化验证，不必每次都上模拟器。
    testImplementation 'org.robolectric:robolectric:4.12.2'

    // 只给 androidTest（真机联调）用，不会进 APK。
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    // 让测试自己授录音权限：Gradle 每跑一次 connectedAndroidTest 都会重装 APK，
    // 而重装会把运行时权限打回未授权。靠人工 adb shell pm grant 的话，
    // 第一次跑得通、第二次就跑不通，且失败信息（expected 0 but was -1）跟来源端毫无关系。
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
